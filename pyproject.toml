[project]
name = "terrella"
version = "0.1.0"
description = "A learned simulator of Earth's magnetosphere"
requires-python = ">=3.11"
dependencies = ["numpy", "pandas", "scipy", "torch", "matplotlib"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["terrella"]
